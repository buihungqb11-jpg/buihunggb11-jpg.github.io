const KEY='onmigwan_ko_v1';let state={qty:{},done:{}};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.qty)state={qty:saved.qty||{},done:saved.done||{}}}catch(e){}

function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function change(id,delta){state.qty[id]=Math.max(0,qty(id)+delta);if(!qty(id))delete state.done[id];persist();render();}
async function copyText(t,b){let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:10px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove()}if(ok){if(b){const old=b.textContent;b.textContent='✓ 복사 완료';setTimeout(()=>b.textContent=old,1100)}}else alert('복사할 수 없습니다. 상품명을 길게 눌러 복사해 주세요.');}
function card(p){const n=qty(p.id);return `<article class="item ${n?'chosen':''}"><div class="alias">${safe(p.alias)}</div><div class="fullname">${safe(p.name)}</div><div class="actions"><button class="copy" data-copy="${p.id}">상품명 복사</button><div class="qtyctl"><span class="unit">${safe(p.unit)}</span><button class="step" data-minus="${p.id}" ${n?'':'disabled'}>−</button><span class="num">${n}</span><button class="step plus" data-plus="${p.id}">+</button></div></div></article>`}
function render(){const list=PRODUCTS.filter(p=>(filter==='all'||filter==='selected'&&qty(p.id)>0||p.group===filter)&&(p.alias+' '+p.name).toLowerCase().includes(search));let out=`<div class="notice">${list.length}개 상품 표시 · 수량은 발주퀵에서 주문할 단위 수량입니다.</div>`;let group='';for(const p of list){if(group!==p.group){group=p.group;out+=`<div class="section">${group==='main'?'자주 주문하는 상품':'추가 상품'}</div>`}out+=card(p)}if(!list.length)out+='<div class="empty">검색 결과가 없습니다.</div>';el('catalog').innerHTML=out;el('count').textContent=`선택 상품 ${picked().length}개`;if(el('view').classList.contains('open'))renderOrder()}
function renderOrder(){const items=picked();const done=items.filter(p=>state.done[p.id]).length;el('progress').textContent=`${done}/${items.length} 입력 완료`;el('orderItems').innerHTML=items.length?items.map(p=>`<article class="orderItem ${state.done[p.id]?'done':''}"><div class="orderTop"><div><div class="alias">${safe(p.alias)}</div><div class="fullname">${safe(p.name)}</div></div><div class="amount">${qty(p.id)} ${safe(p.unit)}</div></div><div class="orderActions"><button class="copy" data-copy="${p.id}">상품명 복사</button><button class="mark ${state.done[p.id]?'done':''}" data-done="${p.id}">${state.done[p.id]?'↶ 완료 취소':'✓ 입력 완료'}</button></div></article>`).join(''):'<div class="empty">선택된 상품이 없습니다. 뒤로 돌아가 + 버튼을 눌러 주세요.</div>'}
el('catalog').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.plus)change(b.dataset.plus,1);else if(b.dataset.minus)change(b.dataset.minus,-1);else if(b.dataset.copy){const p=PRODUCTS.find(x=>x.id===b.dataset.copy);copyText(p.name,b)}});
el('orderItems').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.copy){const p=PRODUCTS.find(x=>x.id===b.dataset.copy);copyText(p.name,b)}else if(b.dataset.done){state.done[b.dataset.done]=!state.done[b.dataset.done];persist();renderOrder()}});
el('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));render()});el('search').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();render()});el('open').onclick=()=>{el('view').classList.add('open');renderOrder()};el('back').onclick=()=>el('view').classList.remove('open');el('copyAll').onclick=e=>{const all='발주\n\n'+picked().map(p=>`${p.name} ${qty(p.id)} ${p.unit}`).join('\n')+'\n\n발주 부탁드립니다.';copyText(all.replace(/\\n/g,'\n'),e.currentTarget)};el('reset').onclick=()=>{if(confirm('발주 수량과 입력 완료 표시를 모두 초기화하시겠습니까?')){state={qty:{},done:{}};persist();el('view').classList.remove('open');render()}};render();
</script></body></html>
