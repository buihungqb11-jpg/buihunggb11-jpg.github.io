<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d39a3b">
<title>온미관 발주 체크리스트</title>
<style>
:root{
  --bg:#f6f2eb;
  --bg-soft:#efe6d5;
  --surface:#fffdf9;
  --surface-2:#fff7ec;
  --ink:#2f261d;
  --muted:#6e6257;
  --wood:#d09034;
  --wood-deep:#a86b24;
  --mint:#d8e7d2;
  --mint-deep:#6b8e69;
  --glass:#5a6668;
  --line:#eadcc6;
  --blue:#2f4858;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--bg-soft) 0,var(--bg) 260px,var(--bg) 100%);color:var(--ink)}
body{padding-bottom:112px}
button,input{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.985)}
.shell{max-width:720px;margin:0 auto}
header{padding:18px 14px 8px;position:sticky;top:0;z-index:8;background:linear-gradient(180deg,rgba(246,242,235,.98),rgba(246,242,235,.96));backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid rgba(168,107,36,.10)}
.hero{background:linear-gradient(135deg,var(--mint) 0 38%, #f1d8af 38% 100%); border:1px solid #d9ccb7; border-radius:28px; padding:16px; box-shadow:0 10px 30px rgba(111,79,35,.08); position:relative; overflow:hidden}
.hero:after{content:'';position:absolute;right:-36px;top:-32px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.28)}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.brand{display:flex;gap:14px;align-items:center}
.brand-badge{width:62px;height:62px;background:#fffef9;border:1.5px solid rgba(47,38,29,.15);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(63,44,17,.08);font-weight:900;color:#3f2d1e;letter-spacing:.04em;line-height:1.12;text-align:center;font-size:12px}
.hero h1{margin:0;font-size:24px;letter-spacing:-.04em}
.hero p{margin:6px 0 0;font-size:12px;color:#53483d;line-height:1.55}
.hero-meta{display:grid;gap:8px;min-width:138px}
.meta-pill{background:rgba(255,253,249,.75);border:1px solid rgba(47,38,29,.08);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;color:#55493e;text-align:center}
.search-wrap{margin-top:14px}
.search{width:100%;border:1px solid #e3d6c1;background:#fffefb;border-radius:16px;padding:15px 15px;font-size:16px;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 2px 0}
.tab{flex-shrink:0;padding:10px 13px;border-radius:999px;border:1px solid #d7c9b3;background:#fffaf1;color:#6d5b47;font-size:13px;font-weight:700}
.tab.on{background:var(--wood);color:#fff;border-color:var(--wood);box-shadow:0 8px 18px rgba(182,121,37,.24)}
main{padding:14px}
.notice{background:rgba(255,253,249,.9);border:1px solid #eadbc4;border-radius:16px;padding:12px 14px;font-size:12px;line-height:1.7;color:#6c5d4f;box-shadow:0 3px 12px rgba(65,47,17,.04)}
.section{margin:18px 4px 10px;font-size:15px;font-weight:900;color:#3a2d21;display:flex;align-items:center;gap:8px}
.section:before{content:'';width:9px;height:9px;border-radius:50%;background:var(--wood);box-shadow:18px 0 0 #e4c48c}
.item{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px;margin:9px 0;box-shadow:0 6px 20px rgba(80,61,28,.05)}
.item.chosen{border-color:#ceab71;box-shadow:0 8px 22px rgba(173,118,43,.14)}
.alias{font-weight:900;font-size:17px;letter-spacing:-.03em;color:#2d241c}
.fullname{font-size:12px;color:#706355;line-height:1.6;margin:7px 0 13px;overflow-wrap:anywhere;user-select:text}
.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.copy{border:1px solid #d8ccb9;border-radius:12px;background:#fff9f0;color:#624b34;padding:10px 12px;font-size:12px;font-weight:800}
.qtyctl{display:flex;align-items:center;gap:8px}
.unit{font-size:11px;color:#837462;min-width:34px;text-align:right}
.num{min-width:28px;text-align:center;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:#2f261d}
.step{width:40px;height:40px;font-size:25px;line-height:1;border-radius:12px;background:#fff;border:1px solid #dbcdb8;color:#634b32}
.step.plus{background:var(--wood);border-color:var(--wood);color:#fff}
.step:disabled{opacity:.32}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,251,245,.96);border-top:1px solid #e6d8c2;backdrop-filter:saturate(180%) blur(10px);z-index:9}
.dock-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-size:15px;font-weight:900;color:#2f261d}
.hint{font-size:11px;color:#7d6d5b;margin-top:4px}
.blue{background:linear-gradient(135deg,var(--wood) 0,var(--wood-deep) 100%);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:800;box-shadow:0 10px 20px rgba(168,107,36,.24)}
.outline{background:#fff;border:1px solid #dacdb8;color:#5f4f3d;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:700}
.empty{text-align:center;padding:36px 10px;color:#7b6b5a;font-size:14px}
.view{display:none;position:fixed;inset:0;background:linear-gradient(180deg,#f5efe6,#f8f4ee);z-index:20;overflow-y:auto}
.view.open{display:block}
.viewbar{position:sticky;top:0;padding:14px;background:rgba(246,242,235,.98);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid #e7dac5;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.viewbar h2{margin:0;font-size:18px;color:#32261c}
.badge{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:5px 9px;border-radius:999px;background:#f4e2bf;color:#6a4b22;font-size:11px;font-weight:800;vertical-align:middle}
.view-body{max-width:720px;margin:0 auto;padding:14px}
.orderItem{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(80,61,28,.05)}
.orderItem.done{opacity:.6}
.orderItem.done .alias{text-decoration:line-through}
.orderTop{display:flex;justify-content:space-between;gap:10px}
.orderLeft{display:flex;gap:10px;align-items:flex-start;min-width:0}
.orderIndex{width:28px;height:28px;border-radius:50%;background:#f0d7ac;color:#6b4d23;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;border:1px solid #e0c594}
.amount{white-space:nowrap;color:var(--wood-deep);font-size:13px;font-weight:900;padding-top:2px}
.orderActions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.mark{border:0;border-radius:12px;background:#e3f0df;color:#2d6b37;padding:10px 12px;font-size:12px;font-weight:800}
.mark.done{background:#e8e3db;color:#6a6258}
.muted{font-size:12px;color:#756556;line-height:1.7}
.bottomActions{display:grid;gap:8px;margin-top:15px}
.warning{font-size:12px;color:#74532b;background:#fff4e5;padding:12px;border-radius:14px;line-height:1.7;border:1px solid #f0d2a6}
.footer-space{height:6px}
@media (min-width:700px){
  header{padding-top:22px}
  .hero{padding:18px 18px 16px}
  main{padding:16px}
}
</style>
</head>
<body>
<header>
  <div class="shell">
    <div class="hero">
      <div class="hero-top">
        <div class="brand">
          <div class="brand-badge">온미관</div>
          <div>
            <h1>온미관 발주 체크리스트</h1>
            <p>매일 재고를 확인하고 필요한 품목만 골라서<br>발주퀵에 바로 검색할 수 있도록 만든 주문용 페이지</p>
          </div>
        </div>
        <div class="hero-meta">
          <div class="meta-pill">모바일 최적화</div>
          <div class="meta-pill">검색어 바로 복사</div>
        </div>
      </div>
      <div class="search-wrap">
        <input type="search" id="search" class="search" placeholder="상품명 검색: 미나리, 식초, 고추, 만두…">
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab on" data-filter="main">자주 주문</button>
        <button class="tab" data-filter="extra">추가 상품</button>
        <button class="tab" data-filter="all">전체 상품</button>
        <button class="tab" data-filter="selected">선택 상품</button>
      </nav>
    </div>
  </div>
</header>
<main id="catalog" class="shell">
  <p class="notice">상품 목록을 불러오는 중입니다.</p>
</main>
<div class="dock">
  <div class="dock-in">
    <div>
      <div class="count" id="count">선택 상품 0개</div>
      <div class="hint">이 기기에서 자동 저장됩니다</div>
    </div>
    <button class="blue" id="open">발주 목록 보기 →</button>
  </div>
</div>
<section class="view" id="view">
  <div class="viewbar shell">
    <h2>발주 목록 <span id="progress" class="badge"></span></h2>
    <button class="outline" id="back">← 돌아가기</button>
  </div>
  <div class="view-body">
    <div class="notice">검색어 복사 → 발주퀵 검색창에 붙여넣기 → 수량 입력 → <b>입력 완료</b> 표시</div>
    <div id="orderItems"></div>
    <div class="bottomActions">
      <button class="blue" id="copyAll">발주 목록 전체 복사</button>
      <button class="outline" id="reset">새 발주 시작 (수량 초기화)</button>
    </div>
    <p class="muted">발주 목록에는 자동으로 번호가 붙습니다. 각 기기별로 선택 수량이 저장되며, 발주퀵으로 주문을 자동 전송하지는 않습니다.</p>
    <div class="footer-space"></div>
  </div>
</section>

PRODUCTS.forEach((p,i)=>{p.clean=CLEAN_NAMES[i];p.lookup=LOOKUP_NAMES[i];});
const KEY='onmigwan_ko_v2';
let state={qty:{},done:{}};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.qty)state={qty:saved.qty||{},done:saved.done||{}}}catch(e){}
let filter='main', search='';
const el=id=>document.getElementById(id);
const qty=id=>Number(state.qty[id]||0);
const picked=()=>PRODUCTS.filter(p=>qty(p.id)>0);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function change(id,delta){state.qty[id]=Math.max(0,qty(id)+delta);if(!qty(id))delete state.done[id];persist();render();}
async function copyText(t,b){let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:10px;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove()}if(ok){if(b){const old=b.textContent;b.textContent='✓ 복사 완료';setTimeout(()=>b.textContent=old,1000)}}else alert('복사할 수 없습니다. 상품명을 길게 눌러 복사해 주세요.');}
function card(p){const n=qty(p.id);return `<article class="item ${n?'chosen':''}"><div class="alias">${safe(p.clean)}</div>${p.clean!==p.lookup?'<div class="fullname">검색어: '+safe(p.lookup)+'</div>':''}<div class="actions"><button class="copy" data-copy="${p.id}">검색어 복사</button><div class="qtyctl"><button class="step" data-minus="${p.id}" ${n?'':'disabled'}>−</button><span class="num">${n}</span><button class="step plus" data-plus="${p.id}">+</button></div></div></article>`}
function render(){
  const list=PRODUCTS.filter(p=>((filter==='all')||(filter==='selected'&&qty(p.id)>0)||(p.group===filter))&&(p.clean+' '+p.lookup+' '+p.alias+' '+p.name).toLowerCase().includes(search));
  let out=`<div class="notice">${list.length}개 상품 표시 · 필요한 수량을 선택하고 검색어를 복사하세요.</div>`;
  let group='';
  for(const p of list){
    if(filter!=='selected'&&filter!=='all' ? group!==p.group : group!==p.group){ if(group!==p.group){group=p.group; out+=`<div class="section">${group==='main'?'자주 주문하는 상품':'추가 상품'}</div>`;} }
    out+=card(p);
  }
  if(!list.length) out+='<div class="empty">검색 결과가 없습니다.</div>';
  el('catalog').innerHTML=out;
  el('count').textContent=`선택 상품 ${picked().length}개`;
  if(el('view').classList.contains('open')) renderOrder();
}
function renderOrder(){
  const items=picked();
  const done=items.filter(p=>state.done[p.id]).length;
  el('progress').textContent=`${done} / ${items.length} 완료`;
  el('orderItems').innerHTML=items.length ? items.map((p,index)=>`<article class="orderItem ${state.done[p.id]?'done':''}"><div class="orderTop"><div class="orderLeft"><div class="orderIndex">${index+1}</div><div><div class="alias">${safe(p.clean)}</div>${p.clean!==p.lookup?'<div class="fullname">검색어: '+safe(p.lookup)+'</div>':''}</div></div><div class="amount">수량 ${qty(p.id)}</div></div><div class="orderActions"><button class="copy" data-copy="${p.id}">검색어 복사</button><button class="mark ${state.done[p.id]?'done':''}" data-done="${p.id}">${state.done[p.id]?'↶ 완료 취소':'✓ 입력 완료'}</button></div></article>`).join('') : '<div class="empty">선택된 상품이 없습니다. 뒤로 돌아가 + 버튼을 눌러 주세요.</div>';
}
el('catalog').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.plus)change(b.dataset.plus,1);else if(b.dataset.minus)change(b.dataset.minus,-1);else if(b.dataset.copy){const p=PRODUCTS.find(x=>x.id===b.dataset.copy);copyText(p.lookup,b)}});
el('orderItems').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.copy){const p=PRODUCTS.find(x=>x.id===b.dataset.copy);copyText(p.lookup,b)}else if(b.dataset.done){state.done[b.dataset.done]=!state.done[b.dataset.done];persist();renderOrder()}});
el('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));render();});
el('search').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();render();});
el('open').onclick=()=>{el('view').classList.add('open');renderOrder();};
el('back').onclick=()=>el('view').classList.remove('open');
el('copyAll').onclick=e=>{
  const lines=picked().map((p,index)=>`${index+1}. ${p.clean} ${qty(p.id)}`);
  const all=`발주\n\n${lines.join('\n')}\n\n발주 부탁드립니다.`;
  copyText(all,e.currentTarget);
};
el('reset').onclick=()=>{if(confirm('발주 수량과 입력 완료 표시를 모두 초기화하시겠습니까?')){state={qty:{},done:{}};persist();el('view').classList.remove('open');render();}};
render();
